[build]
builder = "RAILPACK"
buildCommand = "npm install"

[deploy]
startCommand = "node ./patch-autopilot.js && node ./patch-cost-rules.js && node ./patch-shopify-auth.js && node ./patch-json-output.js && node ./server.js"
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
sleepApplication = false
