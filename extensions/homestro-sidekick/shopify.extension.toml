api_version = "2026-07"

[[extensions]]
name = "Homestro AI Control"
description = "Find, read, optimize, and update Homestro products and variants directly from Shopify Sidekick."
handle = "homestro-sidekick-actions"
type = "admin_link"

[[extensions.targeting]]
target = "admin.app.intent.link"
url = "/"
tools = "./tools.json"
instructions = "./instructions.md"

[[extensions.targeting.intents]]
type = "shopify/product"
action = "import"
schema = "https://extensions.shopifycdn.com/shopifycloud/schemas/v1/shopify/product/gid.json"
