name: homestro-adtech-pilot

services:
  adtech-pilot:
    image: ${PILOT_IMAGE:-ghcr.io/homestro/homestro-adtech-pilot:latest}
    build:
      context: .
      dockerfile: Dockerfile.adtech-pilot
    init: true
    restart: always
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:${PILOT_HTTP_PORT:-8080}:8080"
    environment:
      PILOT_ADMIN_KEY: ${PILOT_ADMIN_KEY:?Set PILOT_ADMIN_KEY in the host secret store}
      DRY_RUN: ${DRY_RUN:-True}
      MARKETING_BUDGET_LIMIT: "0.0"
      PILOT_AD_DRY_RUN: "true"
      PILOT_AD_MAX_BUDGET_EUR: "0"
      PILOT_DAEMON_ENABLED: "true"
      PILOT_AUTOPILOT_ENABLED: "false"
      PILOT_CREATIVE_ENABLED: ${PILOT_CREATIVE_ENABLED:-false}
      PILOT_CREATIVE_MIN_SCORE: "85"
      HOMESTRO_LOGO_URL: ${HOMESTRO_LOGO_URL:-}
      HOMESTRO_BRAND_PRIMARY: ${HOMESTRO_BRAND_PRIMARY:-#246B4B}
      HOMESTRO_BRAND_SECONDARY: ${HOMESTRO_BRAND_SECONDARY:-#F2EFE7}
      HOMESTRO_BRAND_ACCENT: ${HOMESTRO_BRAND_ACCENT:-#D8A83E}
      ALLOW_MICRO_BUDGET: ${ALLOW_MICRO_BUDGET:-false}
      MICRO_BUDGET_PRODUCT_ID: ${MICRO_BUDGET_PRODUCT_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_DSA_BENEFICIARY: ${META_DSA_BENEFICIARY:-}
      META_DSA_PAYOR: ${META_DSA_PAYOR:-}
      META_API_VERSION: ${META_API_VERSION:-v26.0}
      META_BILLING_VERIFIED: ${META_BILLING_VERIFIED:-false}
      META_PURCHASE_EVENT_VERIFIED: ${META_PURCHASE_EVENT_VERIFIED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      META_AD_LIBRARY_ACCESS_TOKEN: ${META_AD_LIBRARY_ACCESS_TOKEN:-}
      HOMESTRO_PRODUCT_FEED_URL: ${HOMESTRO_PRODUCT_FEED_URL:-}
      GMC_MERCHANT_ID: ${GMC_MERCHANT_ID:-}
      GMC_SERVICE_ACCOUNT_JSON: ${GMC_SERVICE_ACCOUNT_JSON:-}
      PILOT_GITHUB_TOKEN: ${PILOT_GITHUB_TOKEN:-}
      PILOT_GITHUB_REPOSITORY: homestro/homestro-ai-api
      PILOT_GITHUB_PR_NUMBER: "104"
      PILOT_FEED_INTERVAL_HOURS: "6"
      PILOT_COMPETITOR_INTERVAL_HOURS: "24"
      PILOT_METRICS_INTERVAL_HOURS: "12"
      PILOT_AUDIT_DB_PATH: /data/adtech-pilot/audit.sqlite3
      PILOT_CREATIVE_DIR: /data/adtech-creatives
    volumes:
      - pilot-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pilot-data:
