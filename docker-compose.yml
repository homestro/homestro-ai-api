name: homestro-adtech-pilot

services:
  adtech-pilot:
    image: ${PILOT_IMAGE:-ghcr.io/homestro/homestro-adtech-pilot:latest}
    build:
      context: .
      dockerfile: Dockerfile.adtech-pilot
    init: true
    restart: always
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:${PILOT_HTTP_PORT:-8080}:8080"
    environment:
      PILOT_ADMIN_KEY: ${PILOT_ADMIN_KEY:?Set PILOT_ADMIN_KEY in the host secret store}
      DRY_RUN: "True"
      MARKETING_BUDGET_LIMIT: "0.0"
      PILOT_AD_DRY_RUN: "true"
      PILOT_AD_MAX_BUDGET_EUR: "0"
      PILOT_AUTOPILOT_ENABLED: "false"
      PILOT_CREATIVE_ENABLED: ${PILOT_CREATIVE_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      META_AD_LIBRARY_ACCESS_TOKEN: ${META_AD_LIBRARY_ACCESS_TOKEN:-}
      PILOT_AUDIT_DB_PATH: /data/adtech-pilot/audit.sqlite3
      PILOT_CREATIVE_DIR: /data/adtech-creatives
    volumes:
      - pilot-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pilot-data:
